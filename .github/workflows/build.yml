name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    # Runs the actual build inside an Ubuntu 24.04 container rather than on
    # the runner's own OS, so the glibc/library versions the AppImage links
    # against are pinned deliberately rather than whatever happens to be on
    # the runner. 24.04 (not something older) is a deliberate choice here,
    # not a compatibility compromise: this tool's actual audience skews
    # toward people already needing something newer PicCheck/Hunter don't
    # play nice with (e.g. Windows 11), so a Linux baseline from a couple
    # years back is a reasonable bet on who's actually running this. A
    # binary built against a newer glibc than a user's system has will
    # refuse to run there at all, so this is still a deliberate ceiling,
    # just a higher one than the oldest-possible-compatibility approach.
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv python3-dev libpython3.12 \
            wget file fuse libfuse2 git binutils \
            libgl1 libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          # Ubuntu 24.04 enforces PEP 668 ("externally managed environment")
          # by default, which blocks a bare system-level pip install. A
          # venv sidesteps that cleanly and is the more correct approach
          # for CI regardless of which Ubuntu version this ends up on.
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r requirements.txt
          /opt/venv/bin/pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: |
          /opt/venv/bin/pyinstaller --noconsole --onedir --name Reliquarium \
            --icon assets/icon.ico --add-data "assets/icon.ico:assets" \
            main.py

      - name: Fetch linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          # linuxdeploy is itself distributed as an AppImage, which
          # normally needs FUSE to mount and run -- often unavailable
          # inside a container without extra privileges. Extracting once
          # and running the extracted AppRun directly sidesteps that
          # entirely rather than fighting FUSE in CI.
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-squashfs-root
          rm -f linuxdeploy-x86_64.AppImage

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/Reliquarium/* AppDir/usr/bin/
          # NOT copying the .desktop file or icon to the AppDir root here
          # -- linuxdeploy's own --desktop-file and --icon-file flags (used
          # in the next step) are documented to handle placing both
          # correctly themselves (desktop file into
          # usr/share/applications/, icon into the proper XDG icon theme
          # structure, plus root-level symlinks for both). A redundant
          # manual copy at the AppDir root, sitting outside that expected
          # structure, risks confusing linuxdeploy's own placement/
          # discovery logic -- which is the likely cause of the "Could not
          # find suitable icon" error despite --icon-file being provided.
          #
          # The icon is ALSO placed at the correct, spec-compliant XDG
          # icon theme path explicitly, as a belt-and-suspenders fallback
          # in case --icon-file's own auto-placement has some other,
          # unrelated quirk -- see the freedesktop icon theme spec:
          # https://specifications.freedesktop.org/icon-theme-spec/icon-theme-spec-latest.html
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/reliquarium.png

      - name: Build the AppImage
        run: |
          export QML_SOURCES_PATHS="$PWD"

          # Deliberately NOT using --plugin qt here. PyInstaller's own
          # PySide6 hooks already correctly bundled everything Qt-related
          # -- both the shared libraries AND the platform plugins (e.g.
          # the "xcb" plugin needed to actually open a window on Linux) --
          # directly into dist/Reliquarium/, which was copied wholesale
          # into AppDir/usr/bin/ in the previous step. linuxdeploy's Qt
          # plugin is built for a RAW, traditionally-built C++ Qt binary
          # that hasn't had any of that done yet -- it goes looking for a
          # conventional Qt SDK layout (qmake, usr/lib/) that doesn't
          # apply here, which is what actually caused the last two
          # failures. Running it on top of an already-PyInstaller-bundled
          # app is redundant at best. Plain linuxdeploy still does useful
          # work without it: resolving non-Qt shared library dependencies,
          # generating AppRun, and packaging everything into the AppImage.
          ./linuxdeploy-squashfs-root/AppRun --appdir AppDir \
            --executable AppDir/usr/bin/Reliquarium \
            --desktop-file packaging/linux/reliquarium.desktop \
            --icon-file assets/icon.png \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reliquarium-x86_64.AppImage
          path: "*.AppImage"

  build-windows:
    name: Windows (onedir)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: |
          pyinstaller --noconsole --onedir --name Reliquarium `
            --icon assets\icon.ico --add-data "assets\icon.ico;assets" `
            main.py

      - name: Zip the build
        run: |
          Compress-Archive -Path dist\Reliquarium\* -DestinationPath Reliquarium-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reliquarium-Windows-x64
          path: Reliquarium-Windows-x64.zip

  release:
    name: Create release
    needs: [build-appimage, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.zip
          generate_release_notes: true
